name: CI

on:
  push:
    # software-factory 是工廠 trunk（stacked PR 的 base）——push 也需獨立綠燈
    # （docs/07 §2.2「每層獨立綠燈」；試點 #3 教訓：觸發條件必須涵蓋 software-factory）
    branches: [main, software-factory]
  pull_request:
    # 不限制分支：涵蓋 factory/**（stacked PR 中間層 base 是前一層 factory/*）與一般分支

jobs:
  unit:
    name: Lint / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  e2e:
    name: E2E (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 啟動 stack
        run: docker compose up -d --build
      - name: 等待容器健康
        run: |
          for i in $(seq 1 30); do
            healthy=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
            if [ "$healthy" -ge 7 ]; then echo "all healthy"; exit 0; fi
            sleep 2
          done
          echo "容器未在時限內全部健康"
          docker compose ps
          docker compose logs
          exit 1
      - name: 跑 E2E
        run: npm run test:e2e
      - name: 收尾
        if: always()
        run: docker compose down -v
